# Ingress configuration for DocTheraLink
# Handles external traffic routing and SSL termination

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doctheralink-ingress
  namespace: doctheralink
  labels:
    app: doctheralink
    component: ingress
  annotations:
    # Nginx ingress controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
      add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # CORS for API
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://doctheralink.com,https://www.doctheralink.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Origin, Content-Type, Accept, Authorization, X-Requested-With"
    
    # Certificate management (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Client body size for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  tls:
  - hosts:
    - doctheralink.com
    - www.doctheralink.com
    - api.doctheralink.com
    secretName: doctheralink-tls
  
  rules:
  # Main frontend domain
  - host: doctheralink.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  
  # WWW redirect
  - host: www.doctheralink.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  
  # API subdomain
  - host: api.doctheralink.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 9000

---
# Certificate issuer for Let's Encrypt (requires cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: doctheralink
    component: certificates
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@doctheralink.com # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Network Policy for security (optional)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: doctheralink-network-policy
  namespace: doctheralink
  labels:
    app: doctheralink
    component: security
spec:
  podSelector:
    matchLabels:
      app: doctheralink
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow ingress from nginx ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080 # frontend (non-root nginx)
    - protocol: TCP
      port: 9000
  
  # Allow internal communication between components
  - from:
    - podSelector:
        matchLabels:
          app: doctheralink
    ports:
    - protocol: TCP
      port: 8080 # frontend (non-root nginx)
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS outbound (for external APIs)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  
  # Allow internal communication
  - to:
    - podSelector:
        matchLabels:
          app: doctheralink
    ports:
    - protocol: TCP
      port: 8080 # frontend (non-root nginx)
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379