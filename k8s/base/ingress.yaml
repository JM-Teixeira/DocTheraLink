# Single host: the SPA at / and the API at /api (overlays set host, class, TLS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: klyniva
spec:
  rules:
    - host: klyniva.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
