# ConfigMap for DocTheraLink application configuration
# Contains non-sensitive configuration data

apiVersion: v1
kind: ConfigMap
metadata:
  name: doctheralink-config
  namespace: doctheralink
  labels:
    app: doctheralink
    component: config
data:
  # Backend configuration
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DB_SSLMODE: "require"
  DB_TIMEZONE: "UTC"
  JWT_EXPIRY: "24h"
  JWT_REFRESH_EXPIRY: "168h"
  ENABLE_SWAGGER: "false"
  
  # Frontend configuration
  REACT_CUSTOM_DESCRIPTION: "DocTheraLink Healthcare Management System"
  
  # Database configuration (non-sensitive)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "care"
  DB_USER: "care"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"