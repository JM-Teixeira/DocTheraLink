# A small server (e.g. an Ubuntu laptop) running k3s. Managed by
# scripts/homeserver.sh, which builds the images, imports them into k3s and
# creates secrets.env (git-ignored) with random values.
#
# Differences from production: one replica (uploads are on the local disk),
# k3s's own ingress (Traefik), any host name (the app calls the API on the
# address it was opened from), nightly database backups to the disk.
# HTTPS: see docs/HOSTING.md (local CA or Let's Encrypt, then add a tls block).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: klyniva

resources:
  - ../../base
  - backup.yaml

configMapGenerator:
  - name: klyniva-config
    behavior: merge
    envs:
      - site.env # PUBLIC_URL and CORS_ALLOWED_ORIGINS, written by the script

secretGenerator:
  - name: klyniva-secrets
    envs:
      - secrets.env

images:
  - name: klyniva/backend
    newTag: home
  - name: klyniva/frontend
    newTag: home

patches:
  - target: { kind: Ingress, name: klyniva }
    patch: |-
      - op: remove
        path: /spec/rules/0/host
      - op: add
        path: /spec/ingressClassName
        value: traefik
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: same-origin
