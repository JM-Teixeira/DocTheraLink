# Backend API deployment for DocTheraLink
# Go-based REST API with horizontal scaling capabilities

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: doctheralink
  labels:
    app: doctheralink
    component: backend
spec:
  replicas: 2 # Horizontal scaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: doctheralink
      component: backend
  template:
    metadata:
      labels:
        app: doctheralink
        component: backend
    spec:
      containers:
      - name: backend
        image: doctheralink/backend:latest # Replace with your registry
        ports:
        - containerPort: 9000
          name: http
        env:
        # Server configuration
        - name: PORT
          value: "9000"
        - name: HOST
          value: "0.0.0.0"
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: GIN_MODE
        
        # Database configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: doctheralink-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_NAME
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_SSLMODE
        - name: DB_TIMEZONE
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: DB_TIMEZONE
        
        # JWT configuration
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: doctheralink-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: JWT_EXPIRY
        - name: JWT_REFRESH_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: JWT_REFRESH_EXPIRY
        
        # Redis configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: REDIS_DB
        
        # Logging configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: doctheralink-config
              key: LOG_FORMAT
        
        # CORS configuration
        - name: CORS_ALLOWED_ORIGINS
          value: "https://doctheralink.com,https://www.doctheralink.com"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for uploads
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: backend-uploads-pvc
      - name: tmp
        emptyDir: {}
      
      # Security context for pod
      securityContext:
        fsGroup: 1000

---
# Persistent Volume Claim for file uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: doctheralink
  labels:
    app: doctheralink
    component: backend
spec:
  accessModes:
    - ReadWriteMany # Multiple pods need access
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Service for backend API
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: doctheralink
  labels:
    app: doctheralink
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  selector:
    app: doctheralink
    component: backend

---
# Horizontal Pod Autoscaler for backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: doctheralink
  labels:
    app: doctheralink
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80