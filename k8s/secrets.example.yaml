# TEMPLATE ONLY — copy to secrets.yaml (git-ignored) or, better, create the
# secrets with kubectl / an external secret manager. Never commit real values.

# Secrets for DocTheraLink application
# Contains sensitive configuration data (base64 encoded)
# NOTE: In production, use proper secret management tools like HashiCorp Vault

apiVersion: v1
kind: Secret
metadata:
  name: doctheralink-secrets
  namespace: doctheralink
  labels:
    app: doctheralink
    component: secrets
type: Opaque
data:
  # Database credentials (base64 encoded)
  # Default password 'care' -> Y2FyZQ==
  DB_PASSWORD: Y2FyZQ==
  
  # JWT secret (base64 encoded)
  # Default secret 'your-super-secret-jwt-key-for-production' -> eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1mb3ItcHJvZHVjdGlvbg==
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1mb3ItcHJvZHVjdGlvbg==
  
  # Redis password (if needed)
  REDIS_PASSWORD: ""

---
# TLS Secret for HTTPS (replace with your actual certificates)
apiVersion: v1
kind: Secret
metadata:
  name: doctheralink-tls
  namespace: doctheralink
  labels:
    app: doctheralink
    component: tls
type: kubernetes.io/tls
data:
  # Replace with your actual certificate and key (base64 encoded)
  tls.crt: LS0tLS1CRUdJTi... # Your certificate here
  tls.key: LS0tLS1CRUdJTi... # Your private key here