services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: care-postgres
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./be/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - care-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: care-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - care-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CARE Backend API
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: care-backend
    environment:
      # Server
      PORT: 9000
      HOST: 0.0.0.0
      GIN_MODE: debug
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: care
      DB_PASSWORD: care
      DB_NAME: care
      DB_SSLMODE: disable
      DB_TIMEZONE: UTC
      
      # JWT
      JWT_SECRET: your-super-secret-jwt-key-for-development
      JWT_EXPIRY: 24h
      JWT_REFRESH_EXPIRY: 168h
      
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:4000,http://frontend:80
      
      # Logging
      LOG_LEVEL: debug
      LOG_FORMAT: text
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Development
      DEBUG: true
      ENABLE_SWAGGER: true
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - care-network
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Klyniva Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: klyniva-frontend
    environment:
      REACT_CARE_API_URL: http://localhost:4000
      REACT_CUSTOM_DESCRIPTION: Klyniva Healthcare Management System
      REACT_APP_TITLE: Klyniva
      REACT_ALLOWED_LOCALES: en,pt
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - care-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer (Database management UI)
  adminer:
    image: adminer:latest
    container_name: care-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - care-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  care-network:
    driver: bridge