# Continuous integration for Klyniva.
# Runs on every push and pull request: backend tests (unit + PostgreSQL
# integration), frontend typecheck/lint/tests/build, and Docker image builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./... && go vet -tags integration ./... && go vet -tags e2e ./...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration tests (PostgreSQL via testcontainers)
        run: go test -tags integration -count=1 ./internal/integration/...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Strict lint for new modules; the inherited codebase still needs a
      # formatting pass (see TODO.md) before linting all of src/.
      - run: npm run lint:strict
      - run: npm run test:coverage # tests + the 80 % patient coverage gate
      - name: Build
        run: npm run build:meta && npm run generate && npm run build:react
        env:
          REACT_CARE_API_URL: http://placeholder

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum
      - name: Start stack
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SEED_DEMO_USERS=true"
          } > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: API end-to-end tests
        working-directory: be
        run: go test -tags e2e -count=1 -v ./internal/e2e/
        env:
          E2E_BASE_URL: http://localhost:4000
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/browser/package-lock.json
      - name: Browser end-to-end tests (Playwright)
        working-directory: e2e/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_WEB_URL: http://localhost:4000
          CI: "true"
      - name: Browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/browser/report
            e2e/browser/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: be
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: fe
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
